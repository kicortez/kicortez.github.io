bio: >-
  I like inheriting tangled codebases and leaving them easier to change, in
  small reversible steps with tests landing alongside the refactor rather than
  one big rewrite. I care about code the next person can read, test and delete
  safely, which is why I lean on dependency injection, clear module boundaries
  and boring names. I stay an IC because the work I do best, untangling
  architecture and shipping the hard feature, happens in the editor, and I use
  AI coding agents every day to spend more of my time there.
