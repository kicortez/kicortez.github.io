{% assign cs = include.study %}
<a class="card cs-card" href="{{ cs.url | relative_url }}">
  {% if cs.hero %}<img src="{{ cs.hero | relative_url }}" alt="" loading="lazy">{% endif %}
  <div class="cs-card-body">
    <h3>{{ cs.title }}</h3>
    <p>{{ cs.summary }}</p>
    <ul class="tags">{% for t in cs.stack limit:3 %}<li>{{ t }}</li>{% endfor %}</ul>
  </div>
</a>
