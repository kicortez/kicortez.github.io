<footer class="site-footer">
  <div class="container">
    <p>
      {% for link in site.data.profile.links %}
        <a href="{{ link.url }}">{{ link.label }}</a>{% unless forloop.last %} · {% endunless %}
      {% endfor %}
    </p>
    <p class="muted">© {{ site.time | date: "%Y" }} {{ site.data.profile.name }}. Built with Jekyll on GitHub Pages.</p>
  </div>
</footer>
